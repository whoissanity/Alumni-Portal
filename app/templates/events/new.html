{% extends "base.html" %}

{% block title %}Create Event — DUET Alumni Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card card-duet card-duet-header-green shadow-sm">
      <div class="card-body p-4">
        <h4 class="card-title text-center mb-4"><i class="bi bi-calendar-plus me-2"></i>Create a New Event</h4>
        <form method="POST" action="{{ url_for('events.new_event') }}">
          
          <div class="mb-3">
            <label for="title" class="form-label">Event Title <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="title" name="title" required value="{{ title if title else '' }}">
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="event_date" class="form-label">Date &amp; Time <span class="text-danger">*</span></label>
              <input type="datetime-local" class="form-control" id="event_date" name="event_date" required value="{{ event_date if event_date else '' }}">
            </div>
            <div class="col-md-6 mb-3">
              <label for="location" class="form-label">Location</label>
              <input type="text" class="form-control" id="location" name="location" value="{{ location if location else '' }}" placeholder="e.g. DUET Auditorium, Online">
            </div>
          </div>

          <div class="mb-4">
            <label for="description" class="form-label">Description <span class="text-danger">*</span></label>
            <textarea class="form-control" id="description" name="description" rows="6" required>{{ description if description else '' }}</textarea>
          </div>

          <button type="submit" class="btn btn-duet-green w-100"><i class="bi bi-check-circle me-1"></i>Create Event</button>
        </form>

      </div>
    </div>
  </div>
</div>
{% endblock %}
