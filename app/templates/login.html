{% extends "base.html" %}

{% block title %}Log In — DUET Alumni Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card card-duet card-duet-header-green shadow-sm">
      <div class="card-body p-4">
        <h4 class="card-title text-center mb-4">Log In</h4>
        <form method="POST" action="{{ url_for('auth.login') }}">
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email"
                   required autofocus>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password"
                   required>
          </div>

          <button type="submit" class="btn btn-duet-green w-100">Log In</button>
        </form>

        <p class="text-center mt-3 mb-0">
          Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-success fw-bold">Register</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
